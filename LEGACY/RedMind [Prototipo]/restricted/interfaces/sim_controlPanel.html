<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RedMind Simulation Control Panel</title>
    <style>
        body {
            background-color: #0c0c0c;
            color: #00ffcc;
            font-family: monospace;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            border: 3px solid #00ffcc;
            padding: 20px;
            background-color: #101010;
            box-shadow: 0 0 10px #00ffcc;
        }

        h1 {
            text-align: center;
            color: #00ffff;
            border-bottom: 1px solid #00ffcc;
            padding-bottom: 10px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h2 {
            color: #00cccc;
            border-bottom: 1px dashed #00ffcc;
            padding-bottom: 5px;
        }

        .subsystem {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
        }

        .slider-group {
            margin: 15px 0;
        }

        .status {
            padding: 8px;
            background-color: #001111;
            border: 1px solid #00ffcc;
            margin-top: 10px;
        }

        input[type="range"] {
            width: 200px;
        }

        .on {
            color: #00ff00;
        }

        .off {
            color: #ff3300;
        }

        .btn {
            background-color: #002222;
            border: 1px solid #00ffcc;
            padding: 8px 16px;
            color: #00ffcc;
            cursor: pointer;
            font-family: monospace;
        }

        .btn:hover {
            background-color: #00ffcc;
            color: #000;
        }

    </style>
</head>
<body>

<div class="container">
    <h1>RedMind - Simulation Control Panel</h1>

    <div class="section">
        <h2>Subsystem Control</h2>
        <div class="subsystem">
            <span>Thermal Regulator</span>
            <button class="btn" onclick="toggleSubsystem('thermal')">Toggle</button>
            <span id="thermalStatus" class="off">OFFLINE</span>
        </div>
        <div class="subsystem">
            <span>Core Simulation Engine</span>
            <button class="btn" onclick="toggleSubsystem('core')">Toggle</button>
            <span id="coreStatus" class="off">OFFLINE</span>
        </div>
        <div class="subsystem">
            <span>Environmental Model</span>
            <button class="btn" onclick="toggleSubsystem('env')">Toggle</button>
            <span id="envStatus" class="off">OFFLINE</span>
        </div>
    </div>

    <div class="section">
        <h2>Simulation Parameters</h2>
        <div class="slider-group">
            <label for="temperature">Temperature:</label>
            <input type="range" id="temperature" min="0" max="100" value="50" oninput="updateParam('temp', this.value)">
            <span id="tempVal">50°C</span>
        </div>
        <div class="slider-group">
            <label for="power">Power Level:</label>
            <input type="range" id="power" min="0" max="10" value="5" oninput="updateParam('power', this.value)">
            <span id="powerVal">5.0 kW</span>
        </div>
    </div>

    <div class="section">
        <h2>Status Report</h2>
        <div class="status" id="statusLog">
            [INIT] Control Panel Online.
        </div>
    </div>
</div>

<script>
    const states = {
        thermal: false,
        core: false,
        env: false
    };

    function toggleSubsystem(name) {
        states[name] = !states[name];
        const statusEl = document.getElementById(name + "Status");
        const log = document.getElementById("statusLog");

        if (states[name]) {
            statusEl.textContent = "ONLINE";
            statusEl.className = "on";
            log.innerHTML += `<br>[+] ${name.toUpperCase()} subsystem ACTIVATED`;
        } else {
            statusEl.textContent = "OFFLINE";
            statusEl.className = "off";
            log.innerHTML += `<br>[-] ${name.toUpperCase()} subsystem DEACTIVATED`;
        }

        log.scrollTop = log.scrollHeight;
    }

    function updateParam(param, value) {
        if (param === "temp") {
            document.getElementById("tempVal").textContent = value + "°C";
            document.getElementById("statusLog").innerHTML += `<br>[PARAM] Temperature set to ${value}°C`;
        } else if (param === "power") {
            document.getElementById("powerVal").textContent = value + ".0 kW";
            document.getElementById("statusLog").innerHTML += `<br>[PARAM] Power set to ${value}.0 kW`;
        }

        document.getElementById("statusLog").scrollTop = document.getElementById("statusLog").scrollHeight;
    }
</script>

</body>
</html>
